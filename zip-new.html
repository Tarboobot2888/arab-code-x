<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نشر ملف · ARAB code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
.brand .dot{background:url(/assets/brand/logo.png) center/cover no-repeat!important}
.zip-thumb{height:130px;border-radius:10px;margin:-4px -4px 10px;background:var(--bg-2,#111) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:42px;border:1px solid var(--border)}
.zip-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.zip-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0 16px}
.zip-head input{flex:1;min-width:200px}
.zip-box{max-width:820px;margin:24px auto}
.zip-box .readme-body{line-height:1.9}
</style>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="48x48" href="https://www.arab-code.cv/assets/brand/favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://www.arab-code.cv/assets/brand/apple-touch-icon.png">
</head>
<body>
<nav class="nav">
  <a href="/" class="brand"><span class="dot"></span> ARAB code</a>
  <div class="nav-actions" id="nav-actions"></div>
</nav>
<main>
  <form class="form" id="form" style="max-width:640px">
    <h2>نشر ملف جاهز</h2>
    <div id="msg" class="msg"></div>
    <div class="field"><label>الملف (zip, rar, 7z, tar.gz — حتى 4 ميغا)</label><input type="file" id="file" accept=".zip,.rar,.7z,.tar,.gz,.tgz,.xz,.bz2" required></div>
    <div class="field"><label>اسم المشروع</label><input name="title" required maxlength="120"></div>
    <div class="field"><label>وصف قصير</label><input name="description" maxlength="300"></div>
    <div class="field"><label>الإصدار (اختياري)</label><input name="version" maxlength="30" placeholder="1.0.0"></div>
    <div class="field"><label>الوسوم (اختياري، مفصولة بفاصلة)</label><input name="tags" placeholder="بوت, موقع"></div>
    <div class="field"><label>صورة معاينة (اختياري)</label><input type="file" id="thumb" accept="image/*"></div>
    <div class="field"><label>README.md</label><textarea name="readme" rows="12" placeholder="# اسم المشروع&#10;طريقة التشغيل..."></textarea></div>
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAFDSVkFD-ysdHC_H" data-theme="dark"></div>
    <button type="submit" class="btn primary submit" id="go">نشر الملف</button>
  </form>
</main>
<footer class="footer"><div class="footer-decoration"></div><div class="footer-content"><div class="footer-rights"><span>© 2026 Code ARAB</span><span class="bmg">— BMG</span></div></div></footer>
<script src="/app.js"></script>
<script src="/ts.js"></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=tsInit" async defer></script>
<script>
function fmtSize(n){if(!n)return"";const u=["B","KB","MB","GB"];let i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i]}
function fmtDate(d){try{return new Date(d).toLocaleDateString("ar")}catch{return""}}
async function gate(){await renderNav();const me=await loadMe();if(!me){location.href="/auth?mode=login";return null}return me}
</script>
<script>
gate();
const readUrl=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
document.getElementById('form').onsubmit=async e=>{
  e.preventDefault();
  const msg=document.getElementById('msg'),go=document.getElementById('go');msg.className='msg';msg.textContent='';
  const f=document.getElementById('file').files[0];
  if(!f)return;
  if(f.size>4*1024*1024){msg.className='msg err';msg.textContent='الملف أكبر من 4 ميغا';return}
  const body=Object.fromEntries(new FormData(e.target).entries());
  body.turnstile_token=(document.querySelector('[name=cf-turnstile-response]')||{}).value||'';
  if(!body.turnstile_token){msg.className='msg err';msg.textContent='اضغط زر التحقق أولاً';return}
  go.disabled=true;
  try{
    msg.textContent='جارٍ رفع الملف...';
    const r=await fetch('/api/zip-upload?name='+encodeURIComponent(f.name),{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/octet-stream'},body:f});
    const up=await r.json().catch(()=>({error:'فشل الرفع'}));
    if(!r.ok)throw new Error(up.error||'فشل الرفع');
    Object.assign(body,{url:up.url,filename:up.filename,size:up.size});
    const t=document.getElementById('thumb').files[0];
    if(t){msg.textContent='جارٍ رفع الصورة...';try{const a=await api('/api/upload-avatar',{method:'POST',body:JSON.stringify({data_url:await readUrl(t),filename:'zip_thumb'})});body.thumb=a.url}catch(_){}}
    msg.textContent='جارٍ النشر...';
    const p=await api('/api/zip-publish',{method:'POST',body:JSON.stringify(body)});
    msg.className='msg ok';msg.textContent='✓ تم النشر';setTimeout(()=>location.href=p.url,700);
  }catch(err){msg.className='msg err';msg.textContent=err.message;go.disabled=false;if(window.turnstile)try{turnstile.reset()}catch(_){}}
};
</script>
</body></html>
