<main class="container">
  <div class="zip-head">
    <h2 style="margin:0">📦 الملفات الجاهزة</h2>
    <input id="q" type="text" placeholder="ابحث عن ملف..." autocomplete="off">
    <a class="btn primary" href="/zip/new">+ نشر ملف</a>
  </div>
  <div id="list" class="grid"></div>
</main>
<footer class="footer"><div class="footer-decoration"></div><div class="footer-content"><div class="footer-rights"><span>© 2026 Code ARAB</span><span class="bmg">— BMG</span></div></div></footer>
<script src="/app.js"></script>
<script>
function fmtSize(n){if(!n)return"";const u=["B","KB","MB","GB"];let i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i]}
function fmtDate(d){try{return new Date(d).toLocaleDateString("ar")}catch{return""}}
async function gate(){await renderNav();const me=await loadMe();if(!me){location.href="/auth?mode=login";return null}return me}
</script>
<script>
function zipCard(z){
  const thumbCss=escCss(z.thumb);
  const th=thumbCss?`style="background-image:url('${thumbCss}')"`:'';
  return `<article class="code-card" onclick="location.href='/zip/${encodeURIComponent(z.slug)}'">
    <div><div class="zip-thumb" ${th}>${thumbCss?'':'📦'}</div>
      <h3 class="card-title">${esc(z.title)}</h3>
      <p class="card-desc">${esc(z.description||'لا يوجد وصف')}</p>
      <div class="zip-meta"><span>${fmtSize(z.size)}</span>${z.version?`<span>v${esc(z.version)}</span>`:''}<span>${fmtDate(z.created_at)}</span></div>
    </div>
    <div class="card-footer">${authorLink(z)}<span class="lang-badge">${esc(z.type||'ZIP')}</span></div>
  </article>`;
}
let T;
async function load(q=''){
  const box=document.getElementById('list');
  try{const {zips}=await api('/api/zips?q='+encodeURIComponent(q));
    box.innerHTML=zips.length?zips.map(zipCard).join(''):'<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px">لا توجد ملفات بعد</p>';
  }catch(e){box.innerHTML=`<p style="color:var(--danger)">${esc(e.message)}</p>`}
}
(async()=>{if(!(await gate()))return;load();
  document.getElementById('q').oninput=e=>{clearTimeout(T);T=setTimeout(()=>load(e.target.value.trim()),250)};})();
</script>
