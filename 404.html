<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة — 404</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@400;700&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: 'Alexandria', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 20px;
    }

    .error-code {
      font-size: 120px;
      font-weight: 700;
      color: #ffd700;
      margin: 0;
      line-height: 1;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
    }

    h1 {
      font-size: 24px;
      margin: 20px 0 10px;
    }

    p {
      color: #a1a1aa;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background: #ffd700;
      color: #000;
      text-decoration: none;
      padding: 12px 30px;
      border-radius: 12px;
      font-weight: 700;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255, 215, 0, 0.2);
    }
  </style>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="48x48" href="https://www.arab-code.cv/assets/brand/favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://www.arab-code.cv/assets/brand/apple-touch-icon.png">
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1>مرحباً، هذه الصفحة غير موجودة</h1>
    <p>يبدو أنك سلكت طريقاً خاطئاً أو أن الصفحة قد تم نقلها. لا تقلق، يمكنك العودة دائماً.</p>
    <a href="/" class="btn">العودة للرئيسية</a>
  </div>
</body>
</html>
