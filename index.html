<header class="hero">

  <h1>ARAB code</h1>
  <p class="tag">منصة نشر الأكواد ARAB CODE</p>
  <div class="stats-bar" id="stats"></div>
</header>

<main class="container">
  <div id="codes" class="grid"></div>
  <div id="pagination" class="pagination"></div>
  <p id="empty" style="text-align:center;color:var(--muted);display:none;margin-top:40px">لا توجد أكواد منشورة بعد.</p>
</main>

<footer class="footer">
  <div class="footer-decoration"></div>
  <div class="footer-content">

      <span>© 2026 Code ARAB</span>
      <span class="bmg">— BMG</span>
    </div>
  </div>
</footer>

<script src="/app.js"></script>
<script>
let allCodes = [];

function showCodeSkeleton(container, count = 6) {
  if (!container) return;
  container.className = 'skeleton-grid';
  container.innerHTML = Array.from({ length: count }, () => `
    <div class="skeleton-card" aria-hidden="true">
      <div class="skeleton-line skeleton-title"></div>
      <div class="skeleton-line skeleton-text"></div>
      <div class="skeleton-line skeleton-text" style="width:70%"></div>
      <div class="skeleton-footer">
        <div class="skeleton-line skeleton-badge"></div>
        <div style="display:flex;gap:6px;align-items:center">
          <div class="skeleton-line skeleton-badge" style="width:60px"></div>
          <div class="skeleton-line skeleton-avatar-sm"></div>
        </div>
      </div>
    </div>`).join('');
}

function revealCards(container) {
  if (!container) return;
  container.className = 'grid';
  [...container.children].forEach((card, index) => {
    card.classList.add('reveal-item');
    card.style.setProperty('--i', index);
  });
}

async function fetchAndRenderCodes() {
  const box = document.getElementById('codes');
  const pagBox = document.getElementById('pagination');
  if (!box) return;
  
  try {
    const { codes } = await api(`/api/list?_t=${Date.now()}`);
    if (!codes || !codes.length) {
      document.getElementById('empty').style.display = 'block';
      box.innerHTML = '';
      if (pagBox) pagBox.innerHTML = '';
      return;
    }
    document.getElementById('empty').style.display = 'none';
    allCodes = codes;
    
    const devs = new Set(codes.map(c => (c.author || '').toLowerCase()).filter(Boolean));
    document.getElementById('stats').innerHTML =
      `<div><b>${codes.length}</b> كود منشور</div><div><b>${devs.size}</b> مطوّر</div>`;
      
    box.innerHTML = codes.map((c) => codeCard(c)).join('');
    revealCards(box);
    if (pagBox) pagBox.innerHTML = '';
  } catch (e) {
    console.error('Error fetching codes:', e);
    box.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px 20px;">
      <p style="color:var(--danger);margin-bottom:12px;">⚠️ تعذّر تحميل الأكواد حالياً</p>
      <button class="btn sm ghost" onclick="fetchAndRenderCodes()">إعادة المحاولة</button>
    </div>`;
  }
}

(async () => {
  showCodeSkeleton(document.getElementById('codes'));
  await Promise.all([renderNav(), fetchAndRenderCodes()]);
  const me = await loadMe();
  await renderBanOverlay(me);
  setInterval(fetchAndRenderCodes, 60000);
})();
</script>
