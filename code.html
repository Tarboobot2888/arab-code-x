<script src="/app.js"></script>
<script>
(async () => {
  await renderNav();
  await renderBanOverlay(await loadMe());
  const parts = location.pathname.split('/').filter(Boolean);
  const filename = decodeURIComponent(parts[0] === 'c' ? (parts[1] || '') : (new URLSearchParams(location.search).get('file') || new URLSearchParams(location.search).get('c') || new URLSearchParams(location.search).get('x') || ''));
  if (!filename) { location.href='/'; return; }
  const stripExt = (s) => String(s).replace(/\.[^.]+$/, '');
  let meta = { title: filename, author: 'unknown', language: (filename.includes('.') ? filename.split('.').pop() : 'txt') };
  try {
    const { codes } = await api('/api/list?_t=' + Date.now());
    // Vercel cleanUrls strips ".html" from the URL, so fall back to a base-name match.
    const found = codes.find(c => c.filename === filename)
      || codes.find(c => stripExt(c.filename) === stripExt(filename))
      || codes.find(c => c.filename.startsWith(filename + '.'));
    if (found) { meta = found; filename = found.filename; }
  } catch {}
  
  // تحديث عنوان الصفحة ووسوم الـ SEO ديناميكياً
  if (meta.title) {
    const fullTitle = `${meta.title} · ARAB code | كود برمجي`;
    document.title = fullTitle;
    
    // Update Meta Tags for SEO & Social Media
    const updateMeta = (name, content, attr='name') => {
      let el = document.querySelector(`meta[${attr}="${name}"]`);
      if (!el) {
        el = document.createElement('meta');
        el.setAttribute(attr, name);
        document.head.appendChild(el);
      }
      el.setAttribute('content', content);
    };
    
    updateMeta('description', meta.description || `تصفح كود ${meta.title} على منصة ARAB code.`);
    updateMeta('og:title', fullTitle, 'property');
    updateMeta('og:description', meta.description || `كود ${meta.title} متاح الآن على ARAB code.`, 'property');
    updateMeta('og:url', window.location.href, 'property');
    // Canonical must point at the resolved filename, not whatever alias or
    // query string the visitor arrived with (APP-04).
    const canonical = document.getElementById('canonical-link');
    if (canonical) canonical.href = `${location.origin}/c/${encodeURIComponent(filename)}`;
    updateMeta('twitter:title', fullTitle);
    updateMeta('twitter:description', meta.description || `تصفح كود ${meta.title} على ARAB code.`);
  }

  const rawUrl = `/api/raw?file=${encodeURIComponent(filename)}`;
  // Served as text/plain + attachment by /api/raw; the GitHub path used to be
  // hardcoded here, which leaked the repository name and broke for a private repo.
  const ghRaw = rawUrl;
  window.__filename = filename;
  const me = await loadMe();
  const isOwner = me && me.username.toLowerCase() === (meta.author||'').toLowerCase();

  const renderAuthor = (m) => authorLink(m);

  document.getElementById('header').innerHTML = `
    <div class="code-header">
      <div>
        <h2 style="margin:0 0 10px 0;">${esc(meta.title)}</h2>
        <div class="meta-row">
          ${renderAuthor(meta)}
          <span>·</span>
          <span class="lang-tag">${esc(meta.language||'txt')}</span>
          <span>·</span>
          <span style="opacity:0.7;">${esc(filename)}</span>
        </div>
      </div>
    </div>`;

  const actions = document.getElementById('actions');
  let siteSettings = { direct_delete:false, delete_requests_enabled:true };
  try { siteSettings = (await api('/api/public-settings')).settings || siteSettings; } catch {}
  const isVerifiedOwner = isOwner && (me.is_verified_badge || me.is_admin);
  const canDirectDelete = !!me && (me.is_admin || isVerifiedOwner || (isOwner && siteSettings.direct_delete));
  const canRequestDelete = !!me && isOwner && !canDirectDelete && siteSettings.delete_requests_enabled;

  // Languages that can be rendered live in a sandboxed preview
  const ext = (filename.includes('.') ? filename.split('.').pop() : '').toLowerCase();
  const previewable = ['html','htm','css','svg','md','markdown'].includes(ext)
    || ['html','css','svg','markdown','md'].includes(String(meta.language||'').toLowerCase());
  window.__filename = filename;

  // ===== Interaction section =====
  const interactSection = document.getElementById('interact-section');
  let allComments = [];
  let visibleCommentsCount = 5;

  function showCommentsSkeleton(container, count = 3) {
    if (!container) return;
    container.innerHTML = Array.from({ length: count }, () => `
      <div class="skeleton-comment">
        <div class="skeleton-comment-avatar"></div>
        <div class="skeleton-comment-body">
          <div class="skeleton-comment-line" style="width:30%"></div>
          <div class="skeleton-comment-line"></div>
          <div class="skeleton-comment-line short"></div>
        </div>
      </div>`).join('');
  }

  function renderCommentsList(me) {
    const box = document.getElementById('comments-box');
    if (!box) return;
    
    const visible = allComments.slice(0, visibleCommentsCount);
    if (!allComments.length) {
      box.innerHTML = '<p style="color:var(--muted);font-size:13px;text-align:center;padding:10px 0">لا تعليقات بعد. كن أول من يعلّق!</p>';
      return;
    }

    let html = visible.map((c, index) => `
      <div class="comment-row reveal-item" style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);--i:${index}">
        <div style="flex-shrink:0">${avatarNode({ username: c.author, avatar_url: c.avatar_url })}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <a href="/u/${encodeURIComponent(c.author)}" style="font-weight:700;color:var(--gold-2);text-decoration:none;font-size:13.5px">${esc(c.display_name || c.author)}</a>
            ${c.is_verified_badge ? verifiedBadge() : ''}
            ${c.line ? `<span class="lang-tag" style="font-size:10.5px">سطر ${c.line}</span>` : ''}
            <span style="font-size:11px;color:var(--muted)">${new Date(c.created_at).toLocaleString('ar')}</span>
            ${me && (me.username.toLowerCase() === c.author.toLowerCase() || me.is_admin) ? `<button class="btn ghost sm" style="font-size:11px;padding:3px 10px" onclick="deleteComment('${c.id}')">حذف</button>` : ''}
          </div>
          <p style="margin:5px 0 0;font-size:13.5px;line-height:1.7;color:var(--text);word-break:break-word">${esc(c.text)}</p>
        </div>
      </div>`).join('');

    if (allComments.length > visibleCommentsCount) {
      html += `<button class="load-more-comments" onclick="loadMoreComments()">عرض المزيد من التعليقات (${allComments.length - visibleCommentsCount})</button>`;
    }
    box.innerHTML = html;
  }

  window.loadMoreComments = function() {
    visibleCommentsCount += 10;
    loadMe().then(me => renderCommentsList(me));
  };

  window.openComments = function() {
    const modal = document.getElementById('commentsModal');
    modal.style.display = 'flex';
    setTimeout(() => modal.classList.add('open'), 10);
    document.body.style.overflow = 'hidden';
  };

  window.closeComments = function() {
    const modal = document.getElementById('commentsModal');
    modal.classList.remove('open');
    setTimeout(() => {
      modal.style.display = 'none';
      document.body.style.overflow = '';
    }, 300);
  };

  async function renderInteraction() {
    if (!interactSection) return;
    const box = document.getElementById('comments-box');
    showCommentsSkeleton(box);
    
    const [comments, me] = await Promise.all([loadComments(filename), loadMe()]);
    allComments = comments;
    const bannedMe = !!(me && me.ban);
    const header = document.getElementById('interact-header');
    header.innerHTML = `
      <div style="display:flex;gap:10px">
        <button class="btn ghost" onclick="openComments()" style="display:inline-flex;align-items:center;gap:8px">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          التعليقات <span style="font-weight:700">${allComments.length}</span>
        </button>
      </div>
      <button class="btn ghost sm" onclick="doReportPrompt()" style="font-size:12.5px;color:var(--muted)">⚑ إبلاغ عن الكود</button>`;
    
    renderCommentsList(me);
    const form = document.getElementById('comment-form');
    if (!me) {
      form.style.display = 'block';
      form.innerHTML = `<a class="btn primary" href="/auth" style="width:100%;text-align:center;border-radius:18px">سجّل دخول لتعلّق على الكود</a>`;
    } else if (bannedMe) {
      form.style.display = 'block';
      form.innerHTML = `<p style="color:var(--danger);font-size:13px;text-align:center">حسابك مغلق مؤقتًا ولا يمكنك التعليق.</p>`;
    } else {
      form.style.display = 'block';
      form.innerHTML = `
        <div style="display:flex;gap:10px;align-items:flex-end">
          <textarea id="commentInput" placeholder="اكتب تعليقك..." style="flex:1;min-height:46px;max-height:120px;padding:12px 14px;border-radius:18px;border:1px solid var(--border);background:#fff;color:var(--text);font-family:'Cairo',sans-serif;font-size:14px;resize:none"></textarea>
          <button class="icon-btn primary" onclick="submitComment(this)" style="width:46px;height:46px;flex-shrink:0;border-radius:18px">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
        <p id="commentMsg" style="margin-top:8px;font-size:12.5px;text-align:center"></p>`;
    }
  }

  window.deleteComment = async function (id) {
    if (!confirm('حذف التعليق؟')) return;
    try {
      await api('/api/comments', { method: 'DELETE', body: JSON.stringify({ id }) });
      await renderInteraction();
    } catch (e) { alert(e.message); }
  };
  window.submitComment = async function (btn) {
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text) return;
    btn.disabled = true;
    const msg = document.getElementById('commentMsg');
    const check = await checkProfanity(text);
    if (!check.ok) {
      msg.style.color = 'var(--danger)';
      msg.textContent = '⚠️ ' + check.warning;
      btn.disabled = false;
      return;
    }
    try {
      await api('/api/comments', { method: 'POST', body: JSON.stringify({ code: filename, text }) });
      input.value = '';
      msg.style.color = 'var(--gold-2)';
      msg.textContent = '✓ تم نشر التعليق';
      setTimeout(() => renderInteraction(), 600);
    } catch (e) {
      msg.style.color = 'var(--danger)';
      msg.textContent = e.message;
      btn.disabled = false;
    }
  };
  window.doReportPrompt = async function () {
    const me = await loadMe();
    if (!me) return alert('سجّل دخول أولاً');
    if (me.ban) return alert('حسابك مغلق ولا يمكنك البلاغ');
    const text = prompt('اكتب سبب البلاغ عن هذا الكود:');
    if (!text || !text.trim()) return;
    const check = await checkProfanity(text);
    if (!check.ok) return alert('⚠️ ' + check.warning);
    try {
      await submitReport(text.trim());
      alert('✓ تم إرسال البلاغ للإدارة');
    } catch (e) { alert(e.message); }
  };
  await renderInteraction();
  window.__filename = filename;

  actions.innerHTML = `
    <button class="btn primary" id="copyBtn" onclick="copyCode()">
      <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      نسخ
    </button>
    <a class="btn" href="${esc(ghRaw)}" target="_blank" rel="noopener noreferrer">Raw / تنزيل</a>
    <a class="btn" href="/submit?fork=${encodeURIComponent(filename)}">🍴 Fork</a>
    ${previewable ? `<button class="btn" id="previewBtn" onclick="togglePreview()">▶ تشغيل / معاينة</button>` : ''}
    ${canDirectDelete ? `<button class="btn danger" onclick="directDelete('${esc(filename)}')">حذف</button>` : (canRequestDelete ? `<button class="btn danger" onclick="requestDelete()">طلب حذف</button>` : '')}
  `;

  try {
    const r = await fetch(rawUrl);
    const t = await r.text();
    window.__codeText = t;
    const codeEl = document.getElementById('code');
    const skeleton = document.getElementById('code-skeleton');
    if (skeleton) skeleton.style.display = 'none';
    codeEl.style.display = 'block';
    codeEl.textContent = t;
    const HL = { js:'javascript', mjs:'javascript', cjs:'javascript', ts:'typescript', py:'python',
      html:'xml', htm:'xml', svg:'xml', md:'markdown', sh:'bash', yml:'yaml', rs:'rust',
      cs:'csharp', cpp:'cpp', c:'c', kt:'kotlin', rb:'ruby', txt:'plaintext' };
    const langKey = String(meta.language || ext || 'plaintext').toLowerCase();
    const hlLang = HL[langKey] || langKey;
    codeEl.className = 'hljs';
    if (window.hljs) {
      try {
        const out = hljs.getLanguage(hlLang) ? hljs.highlight(t, { language: hlLang }) : hljs.highlightAuto(t);
        codeEl.innerHTML = out.value;
      } catch { codeEl.textContent = t; }
    }
    
    let htmlLines = codeEl.innerHTML.split(/\r?\n/);
    if (htmlLines[htmlLines.length - 1].trim() === '') htmlLines.pop(); 
    codeEl.innerHTML = htmlLines.map(line => `<span class="ln"></span>${line}`).join('\n');
    
  } catch (e) {
    document.getElementById('code').textContent = 'تعذّر تحميل الكود';
  }
})();

async function copyCode() {
  const btn = document.getElementById('copyBtn');
  const originalHtml = btn.innerHTML;

  try { 
    await navigator.clipboard.writeText(window.__codeText || ''); 
    btn.innerHTML = `
      <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      تم النسخ
    `;
    
    setTimeout(() => {
      btn.innerHTML = originalHtml;
    }, 2000);

  } catch { 
    btn.innerHTML = 'تعذر النسخ ❌'; 
    setTimeout(() => {
      btn.innerHTML = originalHtml;
    }, 2000);
  }
}

function buildPreviewDoc(text, ext) {
  const e = String(ext || '').toLowerCase();
  // The iframe is sandboxed WITHOUT allow-same-origin, so the preview runs on an
  // opaque origin and cannot read this page's cookies or storage. This CSP adds
  // the second half: the preview cannot call out to the network either, so it
  // cannot exfiltrate anything a visitor pastes into it.
  const CSP = "<meta http-equiv=\"Content-Security-Policy\" content=\""
    + "default-src 'none'; img-src data: blob:; style-src 'unsafe-inline' data:; "
    + "script-src 'unsafe-inline' 'unsafe-eval'; font-src data:; "
    + "connect-src 'none'; form-action 'none'; frame-src 'none'; base-uri 'none'\">";
  const head = '<!doctype html><html><head><meta charset="utf-8">' + CSP;
  const escapeText = (t) => String(t).replace(/[&<>]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));

  if (e === 'css') {
    return head + '<style>' + text + '</style></head>'
      + '<body style="font-family:system-ui;padding:16px">'
      + '<h1>عنوان تجريبي</h1><p>فقرة نصية لمعاينة تنسيقات CSS.</p>'
      + '<button>زر</button> <a href="#">رابط</a>'
      + '<div class="box card container" style="margin-top:12px">.box / .card / .container</div>'
      + '</body></html>';
  }
  if (e === 'svg') {
    return head + '</head><body style="margin:0;display:grid;place-items:center;height:100vh">'
      + text + '</body></html>';
  }
  if (e === 'md' || e === 'markdown') {
    return head + '</head><body style="font-family:system-ui;padding:16px;white-space:pre-wrap">'
      + escapeText(text) + '</body></html>';
  }
  // HTML: inject the CSP right after <head> (or at the start) so the policy
  // applies even to a document that declares its own <head>.
  const t = String(text);
  if (/<head[^>]*>/i.test(t)) return t.replace(/<head[^>]*>/i, (m) => m + CSP);
  if (/<html[^>]*>/i.test(t)) return t.replace(/<html[^>]*>/i, (m) => m + '<head>' + CSP + '</head>');
  return head + '</head><body>' + t + '</body></html>';
}

function togglePreview() {
  const wrap = document.getElementById('preview-wrap');
  const btn = document.getElementById('previewBtn');
  const open = wrap.style.display === 'none';
  wrap.style.display = open ? 'block' : 'none';
  btn.textContent = open ? '■ إيقاف المعاينة' : '▶ تشغيل / معاينة';
  const frame = document.getElementById('preview');
  if (open) {
    const name = window.__filename || '';
    const ext = name.includes('.') ? name.split('.').pop() : 'html';
    frame.srcdoc = buildPreviewDoc(window.__codeText || '', ext);
    wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } else {
    frame.srcdoc = '';
  }
}

async function requestDelete() {
  const reason = prompt('سبب طلب الحذف (اختياري):') || '';
  if (reason === null) return;
  const filename = window.__filename || '';
  try {
    await api('/api/delete-request', { method:'POST', body: JSON.stringify({ filename, reason }) });
    alert('تم إرسال طلب الحذف للإدارة ✓');
  } catch (e) { alert(e.message); }
}

async function directDelete(filename) {
  if (!confirm('حذف الكود نهائياً؟ لا يمكن التراجع.')) return;
  try {
    await api('/api/delete-code', { method:'POST', body: JSON.stringify({ filename }) });
    alert('تم حذف الكود ✓');
    location.href = '/';
  } catch (e) { alert(e.message); }
}
