<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hiura Racing 3D v6.2</title>
<style>
  :root{--bg-0:#05060a;--line:#1e3a5c;--p1:#5ec8ff;--p2:#ff9ec4;--glow-p1:rgba(94,200,255,.65);--glow-p2:rgba(255,158,196,.65);--ink:#e8ecf5;--ink-dim:#7d879e;--nitro:#ff8a30;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;padding:0;}
  body{font-family:'Courier New',ui-monospace,monospace;color:var(--ink);background:transparent;touch-action:manipulation;display:block;width:100%;min-height:0;}
  .wrap{width:100%;max-width:740px;margin:0 auto;padding:8px;display:flex;flex-direction:column;align-items:stretch;}
  .cab{position:relative;width:100%;padding:14px;background:linear-gradient(180deg,#10131f,#090b12);border-radius:22px;border:1px solid var(--line);box-shadow:0 0 0 1px rgba(255,255,255,.02) inset,0 20px 40px -20px rgba(0,0,0,.8);}
  .top{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 12px;flex-wrap:wrap;gap:8px;}
  .brand{font-size:11px;letter-spacing:3px;color:var(--ink-dim);}
  .brand b{color:var(--ink);letter-spacing:1px;}
  .score-row{display:flex;align-items:center;gap:20px;}
  .score{text-align:center;min-width:48px;}
  .score .tag{font-size:9px;letter-spacing:2px;color:var(--ink-dim);margin-bottom:2px;}
  .score .num{font-size:24px;font-weight:bold;line-height:1;font-variant-numeric:tabular-nums;transition:transform .15s;color:var(--p1);text-shadow:0 0 18px var(--glow-p1);}
  .score.p2 .num{color:var(--p2);text-shadow:0 0 18px var(--glow-p2);}
  .score.p3 .num{color:#ffd700;text-shadow:0 0 18px rgba(255,215,0,.7);}
  .score.bump .num{transform:scale(1.3);}
  .divider{color:var(--ink-dim);font-size:18px;}
  .mode-badge{font-size:9px;letter-spacing:2px;color:var(--ink-dim);border:1px solid var(--line);padding:5px 10px;border-radius:20px;}
  .exit-btn{font-family:inherit;font-size:9px;letter-spacing:2px;background:transparent;color:var(--ink-dim);border:1px solid var(--line);padding:6px 12px;border-radius:20px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px;}
  .exit-btn:hover{color:#ff8080;border-color:#ff8080;}
  .stage-wrap{position:relative;width:100%;}
  canvas#game{display:block;width:100%;max-width:540px;margin:0 auto;height:auto;aspect-ratio:1/1;border-radius:14px;border:2px solid var(--p1);box-shadow:0 0 26px var(--glow-p1),0 0 60px -10px var(--glow-p1);background:#1a1f2a;}
  canvas#game.hide{display:none!important;}
  .overlay{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;background:rgba(5,6,10,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px;border:1px solid var(--line);padding:22px 16px;text-align:center;width:100%;box-sizing:border-box;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .overlay.hide{display:none!important;}
  .overlay h1{margin:0;font-size:clamp(22px,6vw,34px);letter-spacing:5px;color:var(--ink);}
  .overlay h1 span{color:var(--p1);text-shadow:0 0 20px var(--glow-p1);}
  .overlay h2{margin:0;font-size:13px;letter-spacing:3px;color:var(--ink-dim);}
  .result{font-size:13px;letter-spacing:2px;margin-bottom:-4px;}
  .result.win{color:var(--p1);}
  .result.lose{color:var(--p2);}
  .final-score{font-size:14px;color:var(--ink);letter-spacing:2px;font-weight:bold;}
  #pauseScreen{position:absolute;inset:0;background:rgba(5,6,10,.85);border:none;}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .row .lbl{width:100%;font-size:9px;letter-spacing:2px;color:var(--ink-dim);margin-top:4px;}
  .chip{font-family:inherit;font-size:10px;letter-spacing:2px;padding:7px 13px;border-radius:20px;background:transparent;color:var(--ink-dim);border:1px solid var(--line);cursor:pointer;transition:.15s;}
  .chip.active{color:var(--bg-0);background:var(--p1);border-color:var(--p1);box-shadow:0 0 16px var(--glow-p1);}
  .theme-grid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:2px;}
  .theme-card{width:90px;padding:7px;border-radius:12px;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.02);transition:.2s;display:flex;flex-direction:column;align-items:center;gap:5px;}
  .theme-card.active{border-color:var(--p1);box-shadow:0 0 18px var(--glow-p1);}
  .theme-card canvas{width:100%;height:44px;border-radius:8px;display:block;border:none;aspect-ratio:auto;}
  .theme-card .name{font-size:9px;letter-spacing:1.2px;color:var(--ink-dim);}
  .theme-card.active .name{color:var(--ink);}
  .btn{margin-top:6px;padding:11px 26px;font-family:inherit;font-size:12px;letter-spacing:3px;color:var(--bg-0);background:var(--p1);border:none;border-radius:8px;cursor:pointer;box-shadow:0 0 22px var(--glow-p1);}
  .btn.ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--line);box-shadow:none;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .bottom{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 2px;font-size:9px;letter-spacing:1.2px;color:var(--ink-dim);flex-wrap:wrap;gap:6px;}
  .hint{display:flex;align-items:center;gap:6px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--p1);}
  .dot.pink{background:var(--p2);}
  .dot.gold{background:#ffd700;}
  .stats-badge{font-size:9px;color:var(--ink-dim);border:1px solid var(--line);padding:5px 10px;border-radius:20px;}
  .control-buttons-wrap{margin:12px auto 0;display:none;gap:8px;width:100%;max-width:440px;}
  .control-buttons-wrap.visible{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;}
  .ctrl-btn{padding:16px 0;font-family:inherit;font-weight:bold;color:var(--p1);background:linear-gradient(180deg,#101625,#090b12);border:1px solid var(--line);border-radius:14px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:.15s;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .ctrl-btn .ctrl-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;z-index:1;}
  .ctrl-btn .ctrl-icon svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 6px var(--glow-p1));}
  .ctrl-btn.brake{color:#ff6060;}
  .ctrl-btn.nitro{color:var(--nitro);}
  .ctrl-btn.nitro .charge{position:absolute;bottom:0;left:0;width:100%;height:0%;background:linear-gradient(0deg,rgba(255,138,48,.5),rgba(255,138,48,.05));transition:height .1s;pointer-events:none;}
  .ctrl-btn.nitro.ready{box-shadow:0 0 20px rgba(255,138,48,.7),inset 0 0 20px rgba(255,138,48,.2);}
  .ctrl-btn:active,.ctrl-btn.active{background:var(--p1);color:var(--bg-0);border-color:var(--p1);transform:scale(.95);}
  .ctrl-btn.brake:active,.ctrl-btn.brake.active{background:#ff4040;border-color:#ff4040;}
  .ctrl-btn.nitro:active,.ctrl-btn.nitro.active{background:var(--nitro);color:var(--bg-0);border-color:var(--nitro);}
  #countdown{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:120px;font-weight:bold;color:#fff;text-shadow:0 0 40px var(--p1),0 0 80px var(--p1);opacity:0;}
  #countdown.show{animation:cdPulse .9s ease-out forwards;}
  @keyframes cdPulse{0%{transform:scale(2);opacity:0}20%{transform:scale(1);opacity:1}100%{transform:scale(.7);opacity:0}}
  @media (max-width:480px){.cab{padding:12px;}.overlay{gap:9px;padding:18px 12px;}.overlay h1{font-size:24px;}.chip{padding:7px 11px;font-size:9px;}.theme-card{width:78px;padding:6px;}.theme-card canvas{height:38px;}.btn{padding:11px 22px;font-size:11px;}.ctrl-btn{padding:14px 0;}.ctrl-btn .ctrl-icon{width:26px;height:26px;}}
</style>
</head>
<body>

<div class="wrap">
<div class="cab">
  <div class="top">
    <div class="brand">HIURA <b>RACING 3D v6.2</b></div>
    <div class="score-row">
      <div class="score p1"><div class="tag">السرعة</div><div class="num" id="s1">0</div></div>
      <div class="divider">·</div>
      <div class="score p3"><div class="tag">عملات</div><div class="num" id="s3">0</div></div>
      <div class="divider">·</div>
      <div class="score p2"><div class="tag">الأفضل</div><div class="num" id="s2">0</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="stats-badge" id="statsBadge">--</div>
      <div class="mode-badge" id="modeBadge">نهار</div>
      <button class="exit-btn" id="muteBtn">🔊</button>
      <button class="exit-btn" id="exitBtn">✕</button>
    </div>
  </div>

  <div class="stage-wrap">
    <canvas id="game"></canvas>
    <div id="countdown"></div>
    <div class="overlay" id="menuScreen">
      <h1>C<span>AR</span> RACING <span style="font-size:.5em;color:var(--ink-dim);">v6.2</span></h1>
      <div class="row">
        <div class="lbl">وضع التحكم</div>
        <button class="chip ctrl-opt active" data-c="buttons">أزرار</button>
        <button class="chip ctrl-opt" data-c="swipe">سحب</button>
        <button class="chip ctrl-opt" data-c="both">الاثنين</button>
      </div>
      <button class="btn" id="toThemeBtn">التالي: اختر البيئة</button>
    </div>

    <div class="overlay hide" id="themeScreen">
      <h2>اختر بيئة السباق</h2>
      <div class="theme-grid" id="themeGrid"></div>
      <div class="btn-row">
        <button class="btn ghost" id="backToMenuBtn">رجوع</button>
        <button class="btn" id="startBtn">ابدأ السباق</button>
      </div>
    </div>

    <div class="overlay hide" id="endScreen">
      <div class="result" id="resultText">تحطمت!</div>
      <h1 id="endTitle">CRASH</h1>
      <div class="final-score" id="finalScore">المسافة: 0 م</div>
      <div class="btn-row">
        <button class="btn ghost" id="exitToMenuBtn">القائمة</button>
        <button class="btn" id="restartBtn">إعادة</button>
      </div>
    </div>

    <div class="overlay hide" id="pauseScreen">
      <h1>PAUSE</h1>
      <div class="btn-row">
        <button class="btn ghost" id="pauseExitBtn">القائمة</button>
        <button class="btn" id="resumeBtn">استكمال</button>
      </div>
    </div>
  </div>

  <div class="control-buttons-wrap" id="controlBarWrap">
    <button class="ctrl-btn" id="btnLeft"><span class="ctrl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6 L9 12 L15 18"/><path d="M20 6 L14 12 L20 18" opacity="0.5"/></svg></span></button>
    <button class="ctrl-btn brake" id="btnBrake"><span class="ctrl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor" opacity="0.35"/></svg></span></button>
    <button class="ctrl-btn nitro" id="btnNitro"><span class="ctrl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 L4 14 L11 14 L10 22 L20 10 L13 10 Z"/></svg></span><span class="charge" id="nitroCharge"></span></button>
    <button class="ctrl-btn" id="btnRight"><span class="ctrl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6 L15 12 L9 18"/><path d="M4 6 L10 12 L4 18" opacity="0.5"/></svg></span></button>
  </div>

  <div class="bottom">
    <div class="hint"><span class="dot"></span> <span>◄ ► · ⛔ فرامل · ⚡ نيترو</span></div>
    <div>Space = إيقاف · Esc = خروج</div>
    <div class="hint"><span>اجمع العملات 💰</span> <span class="dot gold"></span></div>
  </div>
</div>
</div>

(function(global){

      const wy = 0.8 + Math.random() * (h - 1.6);
      const wx = (Math.random() - 0.5) * w * 0.85;
      tmpM.identity(); tmpM.elements[12] = wx; tmpM.elements[13] = wy; tmpM.elements[14] = d/2 + 0.03;
      winGeos.push(winGeo); winMats.push(tmpM.clone());
      const tmpM2 = new THREE.Matrix4(); tmpM2.identity();
      tmpM2.elements[12] = wx; tmpM2.elements[13] = wy; tmpM2.elements[14] = -d/2 - 0.03;
      winGeos.push(winGeo); winMats.push(tmpM2);
    }
    if(winGeos.length > 0){
      const mergedWin = THREE.BufferGeometry.merge(winGeos, winMats);
      const mergedMesh = new THREE.Mesh(mergedWin, new THREE.MeshBasicMaterial({ color: winColor, emissive: winColor, emissiveIntensity: 1.2 }));
      mergedMesh.castShadow = false; mergedMesh.receiveShadow = false;
      g.add(mergedMesh);
    }
    if(type < 0.25){ const top = new THREE.Mesh(new THREE.ConeGeometry(w*0.75, 2.5, 4), bodyMat); top.rotation.y = Math.PI/4; top.position.y = h + 1.25; g.add(top); }
    else if(type < 0.5){ const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.1, 4, 6), new THREE.MeshStandardMaterial({ color: 0x606068, metalness: 0.9, roughness: 0.3 })); ant.position.y = h + 2; g.add(ant);

    else if(type < 0.75){ const annexH = h * 0.4; const annex = new THREE.Mesh(new THREE.BoxGeometry(w*1.6, annexH, d*0.9), bodyMat); annex.position.set(w*0.3, annexH/2, 0); g.add(annex); }
    return g;
  }

  function updateDust(dt){

      d.mesh.scale.x += dt * 1.5; d.mesh.scale.y += dt * 1.5; d.mesh.scale.z += dt * 1.5;
      d.life -= dt * 1.2; d.mesh.material.opacity = Math.max(0, d.life * 0.7);
      if(d.life <= 0){ scene.remove(d.mesh); dustParticles.splice(i, 1); }
    }
  }

  function update(dt){
    gameTime += dt;
    if(countdownActive){
      countdownTimer -= dt;
      const n = Math.ceil(countdownTimer);
      const prevN = Math.ceil(countdownTimer + dt);
      if(n !== prevN && n > 0) showCountdown(n);
      if(countdownTimer <= 0){
        countdownActive = false;
        showCountdown('GO!');
        running = true;
        updateControlBar();
      }
      return;
    }
    updateDust(dt); updateNitroParticles(dt); updateExhaust(dt); updateStreaks(dt);
    if(crashShake > 0){ crashShake = Math.max(0, crashShake - dt*2); shakeApplied = crashShake; }
    else if(shakeApplied > 0) shakeApplied = 0;
    if(!running || paused) return;

    if(nitroActive && nitroReady && nitroAmount > 0){
      nitroAmount = Math.max(0, nitroAmount - dt * 0.4);
      if(nitroAmount <= 0){ nitroReady = false; nitroActive = false; }
      updateNitroUI();
      const carZ = playerCar.position.z, carX = playerCar.position.x;
      for(let i = 0; i < 3; i++) spawnNitroParticle(carX + (Math.random()-0.5)*1.5, carZ + 2.2);
      nitroLight.intensity = 2.5;
    } else {
      nitroAmount = Math.min(1.0, nitroAmount + dt * 0.06);
      if(nitroAmount >= 1) nitroReady = true;
      updateNitroUI();
      nitroLight.intensity = Math.max(0, nitroLight.intensity - dt * 5);
    }

    const isBoosting = nitroActive && nitroReady && nitroAmount > 0;
    if(braking){
      speed = Math.max(MIN_SPEED * 0.5, speed - BRAKE_DECEL * dt);
      if(Math.random() < 0.6){ spawnDust(playerCar.position.x - 0.9, playerCar.position.z); spawnDust(playerCar.position.x + 0.9, playerCar.position.z); }
    } else if(isBoosting){
      speed = Math.min(MAX_NITRO_SPEED, speed + NITRO_ACCEL * dt);
    } else {
      if(speed > MAX_SPEED) speed = Math.max(MAX_SPEED, speed - ACCEL * 2 * dt);
      else speed = Math.min(MAX_SPEED, speed + ACCEL * dt);
    }

    if(Math.random() < speed / MAX_SPEED * (isBoosting ? 1 : 0.5)){
      const ex = playerCar.position;
      spawnExhaust(ex.x - 0.6, ex.z + 2.1, isBoosting);
      spawnExhaust(ex.x + 0.6, ex.z + 2.1, isBoosting);
    }

    if(movingLeft) targetPlayerX = Math.max(-MAX_X, targetPlayerX - LANE_SPEED * dt);
    if(movingRight) targetPlayerX = Math.min(MAX_X, targetPlayerX + LANE_SPEED * dt);
    const dx = targetPlayerX - playerX;
    playerX += dx * Math.min(1, dt * 9);
    const lateralVel = dx * 2.5;
    bodyRoll += (-lateralVel * 0.055 - bodyRoll) * Math.min(1, dt * 6);
    wheelSteer += (-lateralVel * 0.09 - wheelSteer) * Math.min(1, dt * 9);
    const targetPitch = braking ? -0.06 : (isBoosting ? -0.04 : 0.02);
    bodyPitch += (targetPitch - bodyPitch) * Math.min(1, dt * 5);

    const forward = speed * dt * 0.8;
    playerCar.position.z -= forward;
    const bobAmount = (speed / MAX_SPEED) * 0.02;
    const bob = Math.sin(gameTime * 18) * bobAmount;
    const lateralBob = Math.cos(gameTime * 12) * bobAmount * 0.5;
    playerCar.position.x = playerX + lateralBob;
    playerCar.position.y = bob + (isBoosting ? Math.sin(gameTime * 40) * 0.03 : 0);
    playerCar.rotation.z = bodyRoll; playerCar.rotation.x = bodyPitch;
    if(shakeApplied > 0){
      playerCar.position.x += (Math.random() - 0.5) * shakeApplied * 0.3;
      playerCar.position.y += (Math.random() - 0.5) * shakeApplied * 0.2;
    }

    wheelRoll += speed * dt * 2.2;
    playerCar.userData.wheels.forEach(wg => {
      if(wg.children[0] && wg.children[0].userData.rollAxis === 'x') wg.children[0].rotation.x = wheelRoll;
      if(wg.userData.steer) wg.rotation.y = wheelSteer;
    });
    if(playerCar.userData.underglow) playerCar.userData.underglow.material.opacity = 0.3 + 0.15 * Math.sin(performance.now() * 0.006) + (isBoosting ? 0.3 : 0);
    underglowLight.position.set(playerCar.position.x, 0.15, playerCar.position.z);
    underglowLight.intensity = 1.2 + (isBoosting ? 0.8 : 0);

    const carZ = playerCar.position.z;
    headlightL.position.set(playerCar.position.x - 0.55, 0.65, carZ - 1.9);
    headlightR.position.set(playerCar.position.x + 0.55, 0.65, carZ - 1.9);
    headlightL.target = new THREE.Vector3(playerCar.position.x - 0.55, 0.2, carZ - 15);
    headlightR.target = new THREE.Vector3(playerCar.position.x + 0.55, 0.2, carZ - 15);
    nitroLight.position.set(playerCar.position.x, 0.5, carZ + 2.5);
    if(playerCar.userData.tailLights){ const bright = braking ? 3.0 : 1.5; playerCar.userData.tailLights.forEach(m => m.emissiveIntensity = bright); }

    road.position.z = carZ - 100; groundL.position.z = carZ - 100; groundR.position.z = carZ - 100;
    roadTex.offset.y = carZ * 0.02;
    mountains.forEach(m => { if(m.position.z > carZ + 20) m.position.z -= 560; if(m.position.z < carZ - 560) m.position.z += 560; });

    const recycleAhead = 30, recycleBack = -260;
    envObjects.forEach(env => {
      if(env.mesh.position.z > carZ + recycleAhead) env.mesh.position.z -= (env.type === 'pyramid' ? 400 : env.type === 'dune' ? 360 : 240);
      if(env.mesh.position.z < carZ + recycleBack) env.mesh.position.z += (env.type === 'pyramid' ? 400 : env.type === 'dune' ? 360 : 240);
    });
    cityObjects.forEach(c => { if(c.mesh.position.z > carZ + recycleAhead) c.mesh.position.z -= 320; if(c.mesh.position.z < carZ + recycleBack) c.mesh.position.z += 320; });
    barriers.forEach(b => { if(b.mesh.position.z > carZ + recycleAhead) b.mesh.position.z -= 300; if(b.mesh.position.z < carZ + recycleBack) b.mesh.position.z += 300; });

    for(let i = obstacles.length - 1; i >= 0; i--){
      const obs = obstacles[i];
      obs.mesh.position.z -= obs.speed * dt * 0.8;
      obs.swayPhase += dt * obs.swaySpeed * 2;
      const swayX = Math.sin(obs.swayPhase) * obs.swayAmp;
      obs.mesh.position.x = obs.baseX + swayX; obs.mesh.rotation.z = -swayX * 0.15;
      obs.wheelRoll += obs.speed * dt * 1.2;
      obs.mesh.userData.wheels.forEach(wg => { if(wg.children[0] && wg.children[0].userData.rollAxis === 'x') wg.children[0].rotation.x = obs.wheelRoll; });
      const dz = Math.abs(obs.mesh.position.z - carZ), dx2 = Math.abs(obs.mesh.position.x - playerX);
      if(dz < 3.0 && dx2 < 1.85){ obs.mesh.position.z = carZ; gameOver(); return; }
      if(obs.mesh.position.z > carZ + 20){ scene.remove(obs.mesh); obstacles.splice(i, 1); }
    }

    for(let i = coins.length - 1; i >= 0; i--){
      const coin = coins[i];
      coin.rotation.y += coin.userData.rotSpeed * dt;
      coin.position.y = 0.9 + Math.sin(gameTime * 3 + i) * 0.15;
      const dz = Math.abs(coin.position.z - carZ), dx2 = Math.abs(coin.position.x - playerX);
      if(dz < 2.0 && dx2 < 1.5 && !coin.userData.collected){
        coin.userData.collected = true; coinCount++;
        s3El.textContent = String(coinCount); bump(s3El);
        for(let j = 0; j < 12; j++){
          const pg = new THREE.SphereGeometry(0.08, 4, 4);
          const pm = new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.9 });
          const pp = new THREE.Mesh(pg, pm); pp.position.set(coin.position.x, coin.position.y, coin.position.z);
          pp.castShadow = false; pp.receiveShadow = false; scene.add(pp);
          const ang = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 3;
          nitroParticles.push({ mesh: pp, life: 1, vx: Math.cos(ang) * sp, vy: 2 + Math.random() * 2, vz: Math.sin(ang) * sp });
        }
        scene.remove(coin); coins.splice(i, 1); continue;
      }
      if(coin.position.z > carZ + 20){ scene.remove(coin); coins.splice(i, 1); }
    }

    spawnTimer -= dt;
    if(spawnTimer <= 0){ spawnTimer = Math.max(0.55, 1.5 - (speed / MAX_SPEED) * 0.9); spawnObstacle(carZ); }
    coinSpawnTimer -= dt;
    if(coinSpawnTimer <= 0){ coinSpawnTimer = 1.2 + Math.random() * 1.5; spawnCoin(carZ); }

    if(Math.random() < (speed / MAX_SPEED) * 0.5) spawnStreak(carZ);
    distance += speed * dt * 0.4;
    s1El.textContent = String(Math.floor(speed * 1.6));
  }

  let lastTime = performance.now();
  let statsTimer = 0;
  function loop(now){
    requestAnimationFrame(loop);
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if(dt > 0.1) dt = 0.1;
    update(dt);
    const carZ = playerCar.position.z;
    const shakeX = shakeApplied > 0 ? (Math.random() - 0.5) * shakeApplied * 0.8 : 0;
    const shakeY = shakeApplied > 0 ? (Math.random() - 0.5) * shakeApplied * 0.5 : 0;
    const speedRatio = speed / MAX_NITRO_SPEED;
    const targetFov = 70 + speedRatio * 14;
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 3);
    const camOffsetZ = 8.4 - speedRatio * 2.0;
    camera.position.z = carZ + camOffsetZ;
    camera.position.x = playerX * 0.55 + shakeX;
    camera.position.y = 4.2 + shakeY + (nitroActive ? 0.15 : 0);
    camera.lookAt(playerX * 0.4, 1.2, carZ - 15);
    camera.updateProjectionMatrix();
    if(sky) sky.position.set(playerX, 0, carZ);
    if(starField) starField.position.set(0, 0, carZ);
    renderer.render(scene, camera);
    statsTimer += dt;
    if(statsTimer > 0.5){
      statsTimer = 0;
      const caps = renderer.capabilities;
      statsBadge.textContent = (caps.isWebGL2 ? 'GL2 ' : 'GL1 ') + renderer.info.render.calls + ' calls';
    }
  }

  applyTheme(theme);
  spawnEnvironment();
  requestAnimationFrame(loop);

  startBtn.addEventListener('click', () => {
    themeScreen.classList.add('hide'); resetGame();
    countdownActive = true; countdownTimer = 3.0; showCountdown(3);
    lastTime = performance.now();
  });
  restartBtn.addEventListener('click', () => {
    endScreen.classList.add('hide'); resetGame();
    countdownActive = true; countdownTimer = 3.0; showCountdown(3);
    lastTime = performance.now();
  });
  resumeBtn.addEventListener('click', () => { paused = false; pauseScreen.classList.add('hide'); lastTime = performance.now(); });
  exitToMenuBtn.addEventListener('click', goToMenu);
  pauseExitBtn.addEventListener('click', goToMenu);
  exitBtn.addEventListener('click', () => {
    if(running) goToMenu();
    else { menuScreen.classList.remove('hide'); themeScreen.classList.add('hide'); endScreen.classList.add('hide'); pauseScreen.classList.add('hide'); }
  });
})();
</script>
</body>
