<main class="container">

  <p id="empty" role="status" aria-live="polite" style="text-align:center;color:var(--muted);display:none;margin-top:40px">لا توجد أكواد بإعجابات بعد. كن أول من يضع إعجابًا!</p>

<script src="/app.js"></script>
<script>
// /api/likes now exists (APP-01). Its ?top=1 reply is { top: [{code,total}],
// totals }, and the totals come straight from the like keys, so no per-code
// follow-up request and no separately incremented counter that can drift.
async function fetchAndRenderCodes() {
  const box = document.getElementById('codes');
  const empty = document.getElementById('empty');
  const stats = document.getElementById('stats');
  try {
    const [likes, listResp] = await Promise.all([
      api(`/api/likes?top=1&limit=48&_t=${Date.now()}`),
      api('/api/list').catch(() => ({ codes: [] })),
    ]);
    const top = Array.isArray(likes.top) ? likes.top : [];
    if (!top.length) {
      empty.hidden = false;
      empty.style.display = 'block';
      box.innerHTML = '';
      stats.textContent = '';
      return;
    }
    empty.style.display = 'none';
    const byName = new Map((listResp.codes || []).map((c) => [c.filename, c]));
    // Only codes still present in the public index are shown — a like left over
    // from a deleted code must not render a dead card.
    const merged = top
      .map((t) => {
        const full = byName.get(t.code);
        return full ? { ...full, likes: t.total } : null;
      })
      .filter(Boolean);

    if (!merged.length) {
      empty.style.display = 'block';
      box.innerHTML = '';
      stats.textContent = '';
      return;
    }
    box.innerHTML = merged.map((c) => codeCard(c)).join('');
    const devs = new Set(merged.map((c) => String(c.author || '').toLowerCase()).filter(Boolean));
    const totalLikes = merged.reduce((a, c) => a + (c.likes || 0), 0);
    stats.innerHTML = `<div><b>${merged.length}</b> كود متصدّر</div>`
      + `<div><b>${totalLikes}</b> إجمالي الإعجابات</div>`
      + `<div><b>${devs.size}</b> مطوّر</div>`;
  } catch (e) {
    box.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = 'تعذّر تحميل قائمة الأكثر إعجاباً، حاول لاحقاً.';
  }
}

(async () => {
  await renderNav();
  await fetchAndRenderCodes();
  const me = await loadMe();
  await renderBanOverlay(me);
  setInterval(fetchAndRenderCodes, 60000);
})();
</script>
