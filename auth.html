<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Cairo",sans-serif;text-decoration:none;list-style:none}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#fff3c4 0%,#fffdf5 55%);color:#201a08}

.auth-container{position:relative;width:850px;max-width:100%;height:600px;background:#fff;margin:20px;border-radius:30px;box-shadow:0 18px 45px rgba(129,96,0,.14);overflow:hidden;border:1px solid #eadfba}
.auth-container h1{font-size:32px;margin:-6px 0 4px;color:#7a5b00}
.auth-container p{font-size:14px;margin:12px 0;color:#74684c}
form{width:100%;margin:auto}

.form-box{position:absolute;right:0;width:50%;height:100%;background:#fff;display:flex;align-items:flex-start;color:#201a08;text-align:center;padding:36px;z-index:1;transition:.6s ease-in-out 1.2s,visibility 0s 1s;overflow-y:auto}
.auth-container.active .form-box{right:50%}
.form-box.register{visibility:hidden}
.auth-container.active .form-box.register{visibility:visible}

.input-box{position:relative;margin:22px 0}
.input-box input{width:100%;padding:13px 50px 13px 18px;background:#fffbeb;border-radius:10px;border:1px solid #eadfba;outline:none;font-size:15px;color:#201a08;font-weight:500;font-family:"Cairo",sans-serif;transition:border-color .2s}
.input-box input:focus{border-color:#f0b400}
.input-box input::placeholder{color:#a99c7a;font-weight:400}
.input-box i{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:20px;color:#f0b400}

.forgot-link{margin:-12px 0 14px;text-align:left}
.forgot-link a{font-size:13.5px;color:#a9871d;cursor:pointer}

.btn{width:100%;height:48px;background:linear-gradient(135deg,#f0b400,#d4af37);border-radius:10px;box-shadow:0 4px 16px rgba(240,180,0,.25);border:none;cursor:pointer;font-size:16px;color:#111;font-weight:800;font-family:"Cairo",sans-serif;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(240,180,0,.4)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}

.msg{min-height:20px;font-size:.9rem;margin:4px 0;font-weight:600}
.msg.ok{color:#15803d}
.msg.err{color:#c33b22}

.social-login{display:flex;justify-content:center;margin-top:4px}
.social-login a{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:2px solid #eadfba;background:#fff;border-radius:10px;font-size:14px;color:#201a08;font-weight:700;transition:.2s}
.social-login a:hover{border-color:#f0b400;color:#7a5b00}

.toggle-box{position:absolute;width:100%;height:100%}
.toggle-box::before{content:"";position:absolute;left:-250%;width:300%;height:100%;background:linear-gradient(135deg,#f0b400,#b8860b);border-radius:150px;z-index:2;transition:1.8s ease-in-out}
.auth-container.active .toggle-box::before{left:50%}
.toggle-panel{position:absolute;width:50%;height:100%;color:#111;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:2;transition:.6s ease-in-out;padding:20px}
.toggle-panel h1{color:#111}
.toggle-panel p{color:#3a3000;font-weight:600}
.toggle-panel.toggle-left{left:0;transition-delay:1.2s}
.auth-container.active .toggle-panel.toggle-left{left:-50%;transition-delay:.6s}
.toggle-panel.toggle-right{right:-50%;transition-delay:.6s}
.auth-container.active .toggle-panel.toggle-right{right:0;transition-delay:1.2s}
.toggle-panel p{margin-bottom:20px}
.toggle-panel .btn{width:170px;height:46px;background:transparent;border:2px solid #111;box-shadow:none;color:#111}
.toggle-panel .btn:hover{background:#111;color:#f0b400}
.toggle-panel img{width:64px;height:64px;border-radius:50%;object-fit:cover;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.12)}

/* زر التحقق Turnstile داخل النموذج */
.ts-wrap{margin:6px 0 14px}
.ts-btn{background:#fffbeb !important;color:#7a5b00 !important;border-color:#eadfba !important}

.back-home{position:fixed;top:18px;right:22px;color:#7a5b00;font-weight:700;font-size:.95rem;z-index:50;display:flex;align-items:center;gap:6px}
.back-home:hover{text-decoration:underline}

@media screen and (max-width:650px){
  .auth-container{height:calc(100vh - 40px)}
  .form-box{bottom:0;width:100%;height:70%}
  .auth-container.active .form-box{right:0;bottom:30%}
  .toggle-box::before{left:0;top:-270%;width:100%;height:300%;border-radius:20vw}
  .auth-container.active .toggle-box::before{left:0;top:70%}
  .auth-container.active .toggle-panel.toggle-left{left:0;top:-30%}
  .toggle-panel{width:100%;height:30%}
  .toggle-panel.toggle-left{top:0}
  .toggle-panel.toggle-right{right:0;bottom:-30%}
  .auth-container.active .toggle-panel.toggle-right{bottom:0}
  .toggle-panel img{display:none}
}
@media screen and (max-width:400px){
  .form-box{padding:20px}
  .toggle-panel h1{font-size:26px}
}

<body>
<a href="/" class="back-home">← الرئيسية</a>

<div class="auth-container" id="container">

  <!-- نموذج الدخول -->
  <div class="form-box login">
    <form id="login-form">
      <h1 id="login-title">تسجيل الدخول</h1>
      <p id="login-sub">أهلاً بعودتك إلى ARAB code</p>
      <div id="login-msg" class="msg"></div>

      <div class="input-box">
        <input type="email" name="email" placeholder="الإيميل" autocomplete="email" required>
        <i class='bx bxs-envelope'></i>
      </div>
      <div class="input-box">
        <input type="password" name="password" placeholder="كلمة السر" autocomplete="current-password" required minlength="8">
        <i class='bx bxs-lock-alt'></i>
      </div>
      <div class="forgot-link" id="forgot-link">
        <a id="forgot-btn">نسيت كلمة السر؟</a>
      </div>

      <div class="cf-turnstile" data-sitekey="0x4AAAAAAFDSVkFD-ysdHC_H" data-theme="dark"></div>
      <button type="submit" class="btn" id="login-btn">دخول</button>

      <p id="or-login" style="display:none">أو تابع عبر</p>
      <div class="social-login" id="google-login" style="display:none">
        <a href="/api/google">
          <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2.5 24 .5 14.6.5 6.5 5.9 2.6 13.8l7.8 6.1C12.3 13.6 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.9 7.2l7.6 5.9c4.4-4.1 7.1-10.2 7.1-17.6z"/><path fill="#FBBC05" d="M10.4 28.1a14.6 14.6 0 0 1 0-9.2l-7.8-6.1a24 24 0 0 0 0 21.4l7.8-6.1z"/><path fill="#34A853" d="M24 47.5c6.2 0 11.4-2 15.2-5.5l-7.6-5.9c-2.1 1.4-4.8 2.3-7.6 2.3-6.4 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.5 42.1 14.6 47.5 24 47.5z"/></svg>
          <span>جوجل</span>
        </a>
      </div>
    </form>
  </div>

  <!-- نموذج إنشاء حساب -->
  <div class="form-box register">
    <form id="signup-form">
      <h1>إنشاء حساب</h1>
      <p>انضم إلى مجتمع ARAB code</p>
      <div id="signup-msg" class="msg"></div>

      <div class="input-box">
        <input type="text" name="username" placeholder="اسم المستخدم" autocomplete="username" maxlength="20" required>
        <i class='bx bxs-user'></i>
      </div>
      <div class="input-box">
        <input type="email" name="email" placeholder="الإيميل" autocomplete="email" required>
        <i class='bx bxs-envelope'></i>
      </div>
      <div class="input-box">
        <input type="password" name="password" placeholder="كلمة السر (8 أحرف فأكثر)" autocomplete="new-password" required minlength="8">
        <i class='bx bxs-lock-alt'></i>
      </div>
      <div class="input-box">
        <input type="tel" name="phone" placeholder="رقم واتساب (اختياري)" autocomplete="tel">
        <i class='bx bxl-whatsapp'></i>
      </div>

      <div class="cf-turnstile" data-sitekey="0x4AAAAAAFDSVkFD-ysdHC_H" data-theme="dark"></div>
      <button type="submit" class="btn" id="signup-btn">إنشاء الحساب</button>

      <p id="or-signup" style="display:none">أو سجّل عبر</p>
      <div class="social-login" id="google-signup" style="display:none">
        <a href="/api/google">
          <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2.5 24 .5 14.6.5 6.5 5.9 2.6 13.8l7.8 6.1C12.3 13.6 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.9 7.2l7.6 5.9c4.4-4.1 7.1-10.2 7.1-17.6z"/><path fill="#FBBC05" d="M10.4 28.1a14.6 14.6 0 0 1 0-9.2l-7.8-6.1a24 24 0 0 0 0 21.4l7.8-6.1z"/><path fill="#34A853" d="M24 47.5c6.2 0 11.4-2 15.2-5.5l-7.6-5.9c-2.1 1.4-4.8 2.3-7.6 2.3-6.4 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.5 42.1 14.6 47.5 24 47.5z"/></svg>
          <span>جوجل</span>
        </a>
      </div>
    </form>
  </div>

  <!-- اللوح المنزلق -->
  <div class="toggle-box">
    <div class="toggle-panel toggle-left">
      <img src="https://www.arab-code.cv/assets/brand/logo.png" alt="ARAB CODE">
      <h1>أهلاً بك!</h1>
      <p>ليس لديك حساب بعد؟</p>
      <button class="btn register-btn" type="button">إنشاء حساب</button>
    </div>
    <div class="toggle-panel toggle-right">
      <img src="https://www.arab-code.cv/assets/brand/logo.png" alt="ARAB CODE">
      <h1>مرحباً بعودتك!</h1>
      <p>لديك حساب بالفعل؟</p>
      <button class="btn login-btn" type="button">تسجيل الدخول</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
<script src="/ts.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=tsInit" async defer></script>
<script>
const container = document.getElementById('container');
const params = new URLSearchParams(location.search);
let resetMode = false;

// أنميشن التبديل بين اللوحين
document.querySelector('.register-btn').onclick = () => container.classList.add('active');
document.querySelector('.login-btn').onclick = () => container.classList.remove('active');

// فتح صفحة إنشاء الحساب مباشرة عبر ?mode=signup
if (params.get('mode') === 'signup') container.classList.add('active');

// وضع إعادة تعيين كلمة السر ?mode=reset
if (params.get('mode') === 'reset') {
  resetMode = true;
  container.classList.remove('active');
  document.getElementById('login-title').textContent = 'تعيين كلمة السر';
  document.getElementById('login-sub').textContent = 'أدخل كلمة السر الجديدة';
  document.getElementById('login-btn').textContent = 'تغيير كلمة السر';
  document.getElementById('forgot-link').style.display = 'none';
  const emailInput = document.querySelector('#login-form input[name="email"]');
  emailInput.value = params.get('email') || '';
  emailInput.readOnly = true;
}

// عرض زر جوجل حسب إعدادات الأدمن
api('/api/public-settings').then(({ settings }) => {
  if (settings && settings.google_login_enabled !== false) {
    ['google-login','google-signup','or-login','or-signup'].forEach(id => document.getElementById(id).style.display = '');
  }
}).catch(() => {
  ['google-login','google-signup','or-login','or-signup'].forEach(id => document.getElementById(id).style.display = '');
});

// رسالة خطأ قادمة من رابط (مثل فشل دخول جوجل)
if (params.get('error')) {
  const m = document.getElementById('login-msg');
  m.className = 'msg err';
  m.textContent = params.get('error');
}

function tsToken(form) {
  const el = form.querySelector('[name=cf-turnstile-response]');
  return el ? el.value : '';
}

// نسيت كلمة السر
document.getElementById('forgot-btn').onclick = () => {
  const email = document.querySelector('#login-form input[name="email"]').value;
  const msg = document.getElementById('login-msg');
  if (!email) {
    msg.className = 'msg err';
    msg.textContent = 'يرجى كتابة الإيميل أولاً';
    return;
  }
  if (confirm('هل تريد إرسال رابط استعادة كلمة السر إلى ' + email + '؟')) {
    api('/api/forgot-password', { method: 'POST', body: JSON.stringify({ email }) })
      .then(() => { msg.className = 'msg ok'; msg.textContent = '✓ تم إرسال الرابط إلى بريدك.'; })
      .catch(err => { msg.className = 'msg err'; msg.textContent = err.message; });
  }
};

// إرسال نموذج الدخول / إعادة التعيين
document.getElementById('login-form').onsubmit = async (e) => {
  e.preventDefault();
  const msg = document.getElementById('login-msg');
  msg.className = 'msg'; msg.textContent = '';
  const body = Object.fromEntries(new FormData(e.target).entries());
  body.turnstile_token = tsToken(e.target);
  const btn = document.getElementById('login-btn');
  btn.disabled = true; const old = btn.textContent; btn.textContent = '...';
  try {
    if (resetMode) {
      await api('/api/reset-password', { method: 'POST', body: JSON.stringify({ ...body, token: params.get('token') }) });
      msg.className = 'msg ok';
      msg.textContent = '✓ تم تغيير كلمة السر بنجاح. يمكنك الدخول الآن.';
      setTimeout(() => { location.href = '/auth'; }, 2000);
    } else {
      const r = await api('/api/login', { method: 'POST', body: JSON.stringify(body) });
      if (!r || !r.ok || !r.user) throw new Error((r && r.error) || 'فشل تسجيل الدخول');
      location.href = r.user.is_admin ? '/admin' : '/';
    }
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = old;
    if (window.turnstile) try { turnstile.reset(); } catch (_) {}
  }
};

// إرسال نموذج إنشاء الحساب
document.getElementById('signup-form').onsubmit = async (e) => {
  e.preventDefault();
  const msg = document.getElementById('signup-msg');
  msg.className = 'msg'; msg.textContent = '';
  const body = Object.fromEntries(new FormData(e.target).entries());
  body.turnstile_token = tsToken(e.target);
  const btn = document.getElementById('signup-btn');
  btn.disabled = true; const old = btn.textContent; btn.textContent = '...';
  try {
    const r = await api('/api/signup', { method: 'POST', body: JSON.stringify(body) });
    msg.className = 'msg ok';
    msg.textContent = r.warning ? ('✓ ' + r.warning) : '✓ تم إنشاء الحساب. تحقق من بريدك لتفعيل الحساب.';
    setTimeout(() => container.classList.remove('active'), 2000);
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = old;
    if (window.turnstile) try { turnstile.reset(); } catch (_) {}
  }
};
</script>
</body>
</html>
