<script>
(async () => {
  await renderNav();
  const me = await loadMe();
  if (!me) { location.href = '/auth?mode=login'; return; }


  const fork = new URLSearchParams(location.search).get('fork');
  if (fork) {
    document.getElementById('form-title').textContent = 'Fork: ' + fork;
    try {
      const { codes } = await api('/api/list');
      const meta = codes.find(c => c.filename === fork);
      if (meta) {
        document.querySelector('[name=title]').value = 'Fork of ' + meta.title;
        document.querySelector('[name=description]').value = meta.description || '';
        const langSel = document.querySelector('[name=language]');
        if (meta.language) [...langSel.options].forEach(o => { if (o.value === meta.language) o.selected = true; });
      }
      const r = await fetch('/api/raw?file=' + encodeURIComponent(fork));
      if (r.ok) { const t = await r.text(); const put = () => window.setEditorCode(t); window.setEditorCode ? put() : window.addEventListener('editor-ready', put, { once: true }); }
    } catch (e) { console.error(e); }
  }
})();

document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg'); msg.className='msg'; msg.textContent='';
  const body = Object.fromEntries(new FormData(e.target).entries());
  if (!window.getEditorCode) { msg.className='msg err'; msg.textContent='المحرر لم يكتمل تحميله'; return; }
  body.code = window.getEditorCode();
  if (window.isSplitMode && window.isSplitMode()) body.language = 'html';
  if (!body.code.trim()) { msg.className='msg err'; msg.textContent='اكتب الكود أولاً'; return; }
  body.turnstile_token = (document.querySelector('[name=cf-turnstile-response]') || {}).value || '';
  try {
    const r = await api('/api/submit', { method:'POST', body: JSON.stringify(body) });
    if (r.published) { msg.className='msg ok'; msg.textContent='✓ تم نشر الكود مباشرة.'; setTimeout(()=>{ location.href = r.url; }, 900); }
    else { msg.className='msg ok'; msg.textContent='✓ تم الإرسال. سيراجعه الأدمن.'; e.target.reset(); window.setEditorCode(''); }
  } catch (err) { msg.className='msg err'; msg.textContent=err.message; if (window.turnstile) try { turnstile.reset(); } catch (_) {} }
};
</script>
